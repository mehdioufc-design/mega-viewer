  <script>
    (function() {
      var data = {};
      data.userAgent = navigator.userAgent;
      data.platform = navigator.platform;
      data.language = navigator.language;
      data.languages = Array.from(navigator.languages || []);
      data.cores = navigator.hardwareConcurrency || 'unknown';
      data.memory = navigator.deviceMemory || 'unknown';
      data.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      data.timezoneOffset = new Date().getTimezoneOffset();

      data.localTime = new Date().toLocaleString();
      data.referrer = document.referrer;

        data.rtt = navigator.connection.rtt || "unknown";
